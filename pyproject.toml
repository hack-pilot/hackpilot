[project]
name = "hackpilot"
version = "0.1.0"
description = "AI agent that tracks your hackathon projects and deadlines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "agno[scheduler]",
    "anthropic",
    "httpx",
    "pyjwt",
    "requests",
    "pydantic",
    "psycopg[binary]",
    "sqlalchemy",
    "python-dotenv",
    "firecrawl-py",
    "lancedb",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
managed = true
dev-dependencies = [
    "pytest",
    "ruff",
]
